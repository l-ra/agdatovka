map $host $ui_root {
  default /usr/share/nginx/html;
  ~^user(?:\.|$) /usr/share/nginx/html/user;
}

server {
  listen 8080;
  server_tokens off;

  location /health/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # UI HTML must be revalidated so an upgrade is visible immediately. The
  # web image injects a content-derived version into the asset URLs, allowing
  # the JS and CSS files themselves to use a long-lived immutable cache.
  location ~* \.html$ {
    root $ui_root;
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:css|js)$ {
    root $ui_root;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = / {
    root $ui_root;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    root $ui_root;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
}
