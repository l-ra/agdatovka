services:
  api:
    build: .
    env_file: .env
    command: ["python", "-m", "ag_datovka.server", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      db: {condition: service_healthy}
      queue: {condition: service_started}
      objectstore: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "ag_datovka.worker"]
    depends_on:
      db: {condition: service_healthy}
      queue: {condition: service_started}
      objectstore: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
  web:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["8080:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ag_datovka
      POSTGRES_USER: ag_datovka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied by the deployment secret manager}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag_datovka -d ag_datovka"]
  queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [queue-data:/data]
  objectstore:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    volumes: [object-data:/data]

volumes:
  db-data:
  queue-data:
  object-data:
